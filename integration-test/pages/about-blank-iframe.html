<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Forms added to about:blank iframes</title>
    <style>
        * { box-sizing: border-box; font-size: 16px; }
        html, body { height: 100%; margin: 0; font-family: -apple-system, sans-serif; }
        body { display: grid; grid-template-columns: minmax(9em, 35%) 1fr; height: 100dvh; }
        nav { display: flex; flex-direction: column; gap: 0.5em; padding: 0.5em; overflow-y: auto; border-right: 1px solid #ccc; }
        nav a { padding: 0.25em 0; }
        nav button { width: 100%; padding: 0.75em 0.5em; text-align: left; border: 1px solid #999; border-radius: 6px; background: #f4f4f4; }
        nav button[aria-pressed="true"] { background: #333; color: #fff; }
        nav h2 { margin: 1em 0 0; font-weight: bold; }
        main { display: flex; flex-direction: column; min-width: 0; padding: 0.5em; gap: 0.5em; }
        #status { margin: 0; }
        #frame-area { flex: 1; min-height: 0; }
        #frame-area iframe { width: 100%; height: 100%; border: 1px solid #999; border-radius: 6px; }
        #frame-area.flood { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 4px; overflow-y: auto; }
        #frame-area.flood iframe { width: 24px; height: 24px; border-radius: 2px; }
    </style>
</head>

<body>


<nav>
    <a href="../index.html">[Home]</a>
    <button type="button" data-mode="innerHTML">innerHTML</button>
    <button type="button" data-mode="document.write">document.write</button>
    <button type="button" data-mode="document.write (immediately)">document.write (immediately)</button>
    <button type="button" data-mode="javascript: URL">javascript: URL</button>
    <button type="button" data-mode="sandboxed">sandboxed</button>
    <button type="button" data-mode="shadow DOM">shadow DOM</button>
    <button type="button" data-mode="shadow DOM (same-origin URL)">shadow DOM (same-origin URL)</button>
    <button type="button" data-mode="custom element defined later">custom element defined later</button>
    <button type="button" data-mode="lone input">lone input</button>
    <h2>Empty frames</h2>
    <button type="button" data-frames="0">0</button>
    <button type="button" data-frames="10">10</button>
    <button type="button" data-frames="25">25</button>
    <button type="button" data-frames="50">50</button>
    <button type="button" data-frames="100">100</button>
</nav>

<main>
    <p id="status">Pick a case on the left.</p>
    <div id="frame-area"></div>
</main>

<script>
    const FRAME_STYLES = `
        <style>
            * { box-sizing: border-box; font-size: 16px; font-family: -apple-system, sans-serif; }
            input, button { display: block; width: 100%; margin: 0 0 0.75em; padding: 0.5em; }
        </style>
    `;
    const SIGN_UP_FORM = `
        ${FRAME_STYLES}
        <form onsubmit="event.preventDefault()">
            <input type="email" autocomplete="email" placeholder="Email">
            <input type="password" autocomplete="new-password" placeholder="Password">
            <input type="password" autocomplete="new-password" placeholder="Confirm password">
            <button type="submit">Create account</button>
        </form>
    `;
    const DELAY = 1000;
    const status = document.getElementById('status');
    const frameArea = document.getElementById('frame-area');

    let timers = [];
    const later = (fn, ms = DELAY) => timers.push(setTimeout(fn, ms));

    /** @param {string} mode */
    function showFrame(mode) {
        timers.forEach(clearTimeout);
        timers = [];
        frameArea.replaceChildren();
        frameArea.classList.remove('flood');
        for (const button of document.querySelectorAll('[data-frames]')) {
            button.removeAttribute('aria-pressed');
        }

        const iframe = document.createElement('iframe');
        iframe.title = mode;

        switch (mode) {
            case 'innerHTML': {
                frameArea.append(iframe);
                later(() => (iframe.contentDocument.body.innerHTML = SIGN_UP_FORM));
                break;
            }
            case 'document.write': {
                frameArea.append(iframe);
                later(() => writeForm(iframe.contentDocument));
                break;
            }
            case 'document.write (immediately)': {
                frameArea.append(iframe);
                writeForm(iframe.contentDocument);
                break;
            }
            case 'javascript: URL': {
                iframe.src = `javascript:document.write(${JSON.stringify(SIGN_UP_FORM)})`;
                frameArea.append(iframe);
                break;
            }
            case 'sandboxed': {
                iframe.setAttribute('sandbox', 'allow-same-origin allow-forms');
                frameArea.append(iframe);
                later(() => (iframe.contentDocument.body.innerHTML = SIGN_UP_FORM));
                break;
            }
            case 'shadow DOM': {
                frameArea.append(iframe);
                later(() => appendShadowForm(iframe.contentDocument));
                break;
            }
            case 'shadow DOM (same-origin URL)': {
                iframe.src = `${location.pathname}?empty-frame`;
                iframe.addEventListener(
                    'load',
                    () => {
                        iframe.contentDocument.body.replaceChildren();
                        later(() => appendShadowForm(iframe.contentDocument));
                    },
                    { once: true },
                );
                frameArea.append(iframe);
                break;
            }
            case 'custom element defined later': {
                frameArea.append(iframe);
                later(() => iframe.contentDocument.body.append(iframe.contentDocument.createElement('acme-sign-up')));
                later(() => {
                    const win = iframe.contentWindow;
                    win.customElements.define(
                        'acme-sign-up',
                        class extends win.HTMLElement {
                            connectedCallback() {
                                this.attachShadow({ mode: 'open' }).innerHTML = SIGN_UP_FORM;
                            }
                        },
                    );
                }, DELAY * 2);
                break;
            }
            case 'lone input': {
                frameArea.append(iframe);
                later(() => {
                    const doc = iframe.contentDocument;
                    const input = doc.createElement('input');
                    input.type = 'email';
                    input.autocomplete = 'email';
                    input.placeholder = 'Newsletter email';
                    input.style.fontSize = '16px';
                    doc.body.append(input);
                });
                break;
            }
        }

        for (const button of document.querySelectorAll('[data-mode]')) {
            button.setAttribute('aria-pressed', String(button.dataset.mode === mode));
        }
        status.textContent = `Current frame: ${mode}`;
    }

    /** @param {Document} doc */
    function writeForm(doc) {
        doc.open();
        doc.write(`<!DOCTYPE html><html><body>${SIGN_UP_FORM}</body></html>`);
        doc.close();
    }

    /** @param {Document} doc */
    function appendShadowForm(doc) {
        const host = doc.createElement('acme-sign-up');
        host.attachShadow({ mode: 'open' }).innerHTML = SIGN_UP_FORM;
        doc.body.append(host);
    }

    for (const button of document.querySelectorAll('[data-mode]')) {
        button.addEventListener('click', () => showFrame(button.dataset.mode));
    }

    for (const button of document.querySelectorAll('[data-frames]')) {
        button.addEventListener('click', () => {
            location.search = `?frames=${button.dataset.frames}`;
        });
    }

    const frameCount = new URLSearchParams(location.search).get('frames');
    if (frameCount !== null) {
        frameArea.classList.add('flood');
        for (let i = 0; i < Number(frameCount); i++) {
            frameArea.append(document.createElement('iframe'));
        }
        for (const button of document.querySelectorAll('[data-frames]')) {
            button.setAttribute('aria-pressed', String(button.dataset.frames === frameCount));
        }
        status.textContent = `${frameCount} empty about:blank frames`;
    }
</script>

</body>

</html>
