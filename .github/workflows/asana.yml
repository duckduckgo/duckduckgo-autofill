name: 'asana sync'
# NOTE: Automatic Asana sync is disabled. The workflow only runs when triggered
# manually via the Actions tab. To re-enable, restore the commented triggers below
# and remove `workflow_dispatch`.
on:
    workflow_dispatch:
    # pull_request_review:
    # pull_request_target:
    #     types:
    #         - opened
    #         - edited
    #         - closed
    #         - reopened
    #         - synchronize
    #         - review_requested

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: duckduckgo/action-asana-sync@v11
              with:
                  ASANA_ACCESS_TOKEN: ${{ secrets.NATIVE_APPS_WORKFLOW }}
                  ASANA_WORKSPACE_ID: ${{ secrets.ASANA_WORKSPACE_ID }}
                  ASANA_PROJECT_ID: '1198964220583541'
                  GITHUB_PAT: ${{ secrets.GH_RO_PAT }}
                  USER_MAP: ${{ vars.USER_MAP }}
                  ASSIGN_PR_AUTHOR: 'true'
