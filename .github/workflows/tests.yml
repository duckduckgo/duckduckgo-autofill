name: Test

on:
    push:
        branches: [main]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v3
            - uses: actions/setup-node@v3
              with:
                  node-version-file: '.nvmrc'
            - uses: actions/cache@v3
              with:
                  path: |
                      ~/.npm
                      node_modules
                      packages/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-node-
            - name: npm ci
              run: 'npm ci'
            - name: 'TEMP: verify npm cooldown'
              run: |
                  node -v && npm -v
                  VERSION=$(npm view electron-to-chromium time --json | node -e 'const t=JSON.parse(require("fs").readFileSync(0));const v=Object.entries(t).filter(([k,d])=>/^\d/.test(k)&&(Date.now()-new Date(d))/864e5<6.5&&(Date.now()-new Date(d))/864e5>1).pop();console.log(v[0], ((Date.now()-new Date(v[1]))/864e5).toFixed(2), "days old")')
                  echo "Testing electron-to-chromium@$VERSION"
                  for dir in . packages/password; do
                      echo "== $dir"
                      if (cd "$dir" && npm pack --dry-run "electron-to-chromium@${VERSION%% *}" 2>&1 | tee /dev/stderr | grep -q ETARGET); then
                          echo "PASS: cooldown in force in $dir"
                      else
                          echo "FAIL: cooldown not in force in $dir"; exit 1
                      fi
                  done
            - name: 'Clean tree'
              run: 'npm run test:clean-tree'
            - name: 'ESLint'
              run: 'npm run lint'
            - name: 'Typescript'
              run: 'npm run tsc'
            - name: 'Unit Tests'
              run: 'npm run test:unit'
            - name: 'Password unit tests'
              run: 'npm run test:passwords'
            - name: Cache Playwright browsers
              uses: actions/cache@v3
              id: playwright-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-playwright-
            - name: Install Playwright + DEPS
              run: npx playwright install --with-deps
              if: steps.playwright-cache.outputs.cache-hit != 'true'
            - name: Install only system dependencies if browsers are cached
              run: npx playwright install-deps
              if: steps.playwright-cache.outputs.cache-hit == 'true'
            - name: 'Install dependencies for CI integration tests'
              run: sudo apt-get install xvfb
            - run: npm run test:integration:ci
            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-results
                  path: test-results
